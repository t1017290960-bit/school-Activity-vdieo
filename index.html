<!DOCTYPE html>
<html lang="zh-Hant" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相片循環播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .fade-enter {
      opacity: 0;
      transform: scale(1.02);
    }
    .fade-active {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.8s ease-in-out, transform 1.2s ease-out;
    }
    .fade-exit {
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .hide-controls {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white h-full flex flex-col overflow-hidden select-none font-sans">

  <!-- 幻燈片主容器 -->
  <div id="slideshow-container" class="relative flex-1 w-full h-full overflow-hidden bg-black flex items-center justify-center">
    
    <!-- 兩層影像元素切換實現極度流暢的淡入淡出 -->
    <div id="slide-a" class="absolute inset-0 bg-contain bg-center bg-no-repeat transition-all"></div>
    <div id="slide-b" class="absolute inset-0 bg-contain bg-center bg-no-repeat transition-all opacity-0"></div>

    <!-- 頂部控制欄（浮動） -->
    <header id="top-bar" class="absolute top-0 left-0 right-0 p-4 bg-gradient-to-b from-black/80 via-black/40 to-transparent flex items-center justify-between z-30 transition-opacity duration-300">
      <div class="flex items-center gap-3">
        <span class="bg-indigo-600/90 text-xs px-2.5 py-1 rounded-full font-medium tracking-wide">
          <i class="fa-solid fa-images mr-1"></i>相片輪播
        </span>
        <span id="counter" class="text-sm font-medium text-zinc-300">1 / 5</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- 上傳本地照片按鈕 -->
        <label class="cursor-pointer bg-white/10 hover:bg-white/20 active:scale-95 transition px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 backdrop-blur-md">
          <i class="fa-solid fa-cloud-arrow-up text-indigo-400"></i>
          <span>新增相片</span>
          <input type="file" id="file-input" multiple accept="image/*" class="hidden">
        </label>

        <!-- 全螢幕切換按鈕（醒目標註） -->
        <button id="fullscreen-btn" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition px-3.5 py-1.5 rounded-lg text-sm flex items-center gap-1.5 backdrop-blur-md text-white font-medium shadow-md shadow-indigo-600/30" title="切換全螢幕 (快捷鍵: F)">
          <i id="fs-icon" class="fa-solid fa-expand"></i>
          <span id="fs-text">全螢幕播放</span>
        </button>
      </div>
    </header>

    <!-- 左右切換按鈕 -->
    <button id="prev-btn" class="control-ui absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/40 hover:bg-black/70 active:scale-90 text-white backdrop-blur-md flex items-center justify-center transition-all z-20" title="上一張">
      <i class="fa-solid fa-chevron-left text-lg"></i>
    </button>
    <button id="next-btn" class="control-ui absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/40 hover:bg-black/70 active:scale-90 text-white backdrop-blur-md flex items-center justify-center transition-all z-20" title="下一張">
      <i class="fa-solid fa-chevron-right text-lg"></i>
    </button>

    <!-- 底部控制面版與指示器 -->
    <div id="bottom-bar" class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-black/85 via-black/40 to-transparent flex flex-col items-center gap-3 z-30 transition-opacity duration-300">
      
      <!-- 圓點導航 -->
      <div id="dots-container" class="flex items-center gap-1.5 py-1"></div>

      <!-- 操作面板 -->
      <div class="flex items-center gap-4 bg-zinc-900/80 backdrop-blur-md border border-white/10 px-4 py-2 rounded-full shadow-2xl">
        <!-- 播放 / 暫停 -->
        <button id="play-btn" class="text-indigo-400 hover:text-indigo-300 text-lg transition active:scale-90 w-8 h-8 flex items-center justify-center" title="播放 / 暫停">
          <i id="play-icon" class="fa-solid fa-pause"></i>
        </button>

        <div class="h-4 w-px bg-white/20"></div>

        <!-- 播放速度/間隔設定 -->
        <div class="flex items-center gap-2 text-xs text-zinc-300">
          <i class="fa-solid fa-gauge-high text-indigo-400"></i>
          <span>播放速度:</span>
          <select id="interval-select" class="bg-black/60 text-white text-xs border border-white/20 rounded-md px-2.5 py-1 outline-none cursor-pointer focus:border-indigo-500 font-medium">
            <option value="1000">超快 (1 秒)</option>
            <option value="1500">快速 (1.5 秒)</option>
            <option value="2000">較快 (2 秒)</option>
            <option value="3000" selected>適中 (3 秒)</option>
            <option value="4000">標準 (4 秒)</option>
            <option value="5000">慢速 (5 秒)</option>
            <option value="8000">極慢 (8 秒)</option>
          </select>
        </div>

        <div class="h-4 w-px bg-white/20"></div>

        <!-- 顯示比例模式 -->
        <button id="fit-mode-btn" class="text-xs text-zinc-300 hover:text-white px-2 py-1 rounded transition bg-white/5 hover:bg-white/10" title="切換顯示比例（完整呈現 / 填滿畫面）">
          完整等比
        </button>
      </div>
    </div>
  </div>

  <script>
    // 使用您上傳的活動點名相片
    let photos = [
      { url: 'https://inskvcdsblyukxuqeqoz.supabase.co/storage/v1/object/sign/interactive-tools-bucket/user_3JToioDfZjv8bhcMCl8vBy2mapl/5f4004ee-633a-4873-9c5c-6c2785093c71.png?token=eyJraWQiOiI4MTYwZjkwMC1kYTUyLTQ5ZjEtYmYwOC04Y2JkMTgwNjcwMDUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbnRlcmFjdGl2ZS10b29scy1idWNrZXQvdXNlcl8zSlRvaW9EZlpqdjhiaGNNQ2w4dkJ5Mm1hcGwvNWY0MDA0ZWUtNjMzYS00ODczLTljNWMtNmMyNzg1MDkzYzcxLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTAwNjE5NjksImV4cCI6MTc5MDA2MjI2OX0.icydehjz_aoFD5brTuiXHJ45ujuvVvVPtS7Qbs2dgis', title: '每日課外活動 (1)' },
      { url: 'https://inskvcdsblyukxuqeqoz.supabase.co/storage/v1/object/sign/interactive-tools-bucket/user_3JToioDfZjv8bhcMCl8vBy2mapl/9ed36789-8aa7-4591-a5ae-9342b4aa9169.png?token=eyJraWQiOiI4MTYwZjkwMC1kYTUyLTQ5ZjEtYmYwOC04Y2JkMTgwNjcwMDUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbnRlcmFjdGl2ZS10b29scy1idWNrZXQvdXNlcl8zSlRvaW9EZlpqdjhiaGNNQ2w4dkJ5Mm1hcGwvOWVkMzY3ODktOGFhNy00NTkxLWE1YWUtOTM0MmI0YWE5MTY5LnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTAwNjE5NjksImV4cCI6MTc5MDA2MjI2OX0.SieD8T-cy3id87xzBc2dBR-jejp2SHbJdF_CpBOUWUE', title: '每日課外活動 (2)' },
      { url: 'https://inskvcdsblyukxuqeqoz.supabase.co/storage/v1/object/sign/interactive-tools-bucket/user_3JToioDfZjv8bhcMCl8vBy2mapl/618c1188-e214-4160-a7ea-68aa13770dd2.png?token=eyJraWQiOiI4MTYwZjkwMC1kYTUyLTQ5ZjEtYmYwOC04Y2JkMTgwNjcwMDUiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJpbnRlcmFjdGl2ZS10b29scy1idWNrZXQvdXNlcl8zSlRvaW9EZlpqdjhiaGNNQ2w4dkJ5Mm1hcGwvNjE4YzExODgtZTIxNC00MTYwLWE3ZWEtNjhhYTEzNzcwZGQyLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3OTAwNjE5NjksImV4cCI6MTc5MDA2MjI2OX0.usZEbQmsxAs7OYMVMrsGXOrNACgiVWq8SxQQISJB1VM', title: '每日課外活動 (3)' }
    ];

    let currentIndex = 0;
    let isPlaying = true;
    let playIntervalMs = 3000;
    let timer = null;
    let currentLayer = 'a'; // 'a' 或 'b' 雙緩衝切換
    let isContainMode = true;
    let hideControlsTimeout = null;

    // DOM 元素
    const container = document.getElementById('slideshow-container');
    const slideA = document.getElementById('slide-a');
    const slideB = document.getElementById('slide-b');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const counter = document.getElementById('counter');
    const dotsContainer = document.getElementById('dots-container');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fsText = document.getElementById('fs-text');
    const intervalSelect = document.getElementById('interval-select');
    const fileInput = document.getElementById('file-input');
    const fitModeBtn = document.getElementById('fit-mode-btn');
    const topBar = document.getElementById('top-bar');
    const bottomBar = document.getElementById('bottom-bar');
    const controlUIs = [topBar, bottomBar, prevBtn, nextBtn];

    // 初始化載入
    function init() {
      renderDots();
      updateDisplay(false);
      startAutoplay();
    }

    // 渲染導航指示小圓點
    function renderDots() {
      dotsContainer.innerHTML = '';
      photos.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.className = `h-2 rounded-full transition-all duration-300 ${
          idx === currentIndex ? 'w-6 bg-indigo-500' : 'w-2 bg-white/40 hover:bg-white/70'
        }`;
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          goToIndex(idx);
        });
        dotsContainer.appendChild(dot);
      });
      counter.textContent = `${currentIndex + 1} / ${photos.length}`;
    }

    // 切換至指定照片
    function goToIndex(nextIndex) {
      if (photos.length === 0) return;
      currentIndex = (nextIndex + photos.length) % photos.length;
      updateDisplay(true);
      resetAutoplay();
    }

    // 更新畫面影像（平滑過渡）
    function updateDisplay(animated = true) {
      if (photos.length === 0) return;
      const targetPhoto = photos[currentIndex];
      const targetFitClass = isContainMode ? 'bg-contain' : 'bg-cover';

      if (currentLayer === 'a') {
        // 由 A 切換到 B
        slideB.style.backgroundImage = `url("${targetPhoto.url}")`;
        slideB.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-opacity duration-700 opacity-100`;
        slideA.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-opacity duration-700 opacity-0`;
        currentLayer = 'b';
      } else {
        // 由 B 切換到 A
        slideA.style.backgroundImage = `url("${targetPhoto.url}")`;
        slideA.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-opacity duration-700 opacity-100`;
        slideB.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-opacity duration-700 opacity-0`;
        currentLayer = 'a';
      }

      renderDots();
    }

    // 自動播放計時
    function startAutoplay() {
      if (timer) clearInterval(timer);
      if (!isPlaying) return;
      timer = setInterval(() => {
        goToIndex(currentIndex + 1);
      }, playIntervalMs);
    }

    function stopAutoplay() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function resetAutoplay() {
      if (isPlaying) {
        startAutoplay();
      }
    }

    // 播放 / 暫停按鈕
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.className = 'fa-solid fa-pause';
        startAutoplay();
      } else {
        playIcon.className = 'fa-solid fa-play';
        stopAutoplay();
      }
    });

    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      goToIndex(currentIndex - 1);
    });

    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      goToIndex(currentIndex + 1);
    });

    // 點擊畫面左右半部也能換頁
    container.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('select') || e.target.closest('label')) return;
      const rect = container.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX < rect.width / 3) {
        goToIndex(currentIndex - 1);
      } else if (clickX > (rect.width * 2) / 3) {
        goToIndex(currentIndex + 1);
      } else {
        playBtn.click();
      }
    });

    // 播放間隔變更
    intervalSelect.addEventListener('change', (e) => {
      playIntervalMs = parseInt(e.target.value, 10);
      resetAutoplay();
    });

    // 畫面顯示模式切換（完整適配 vs 填滿畫面）
    fitModeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isContainMode = !isContainMode;
      fitModeBtn.textContent = isContainMode ? '完整等比' : '填滿畫面';
      const targetFitClass = isContainMode ? 'bg-contain' : 'bg-cover';
      slideA.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-all ${slideA.classList.contains('opacity-100') ? 'opacity-100' : 'opacity-0'}`;
      slideB.className = `absolute inset-0 ${targetFitClass} bg-center bg-no-repeat transition-all ${slideB.classList.contains('opacity-100') ? 'opacity-100' : 'opacity-0'}`;
    });

    // 全螢幕切換（完整支援主流與行動裝置瀏覽器）
    function toggleFullScreen() {
      const el = container;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

      if (!isFs) {
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(err => console.warn("全螢幕請求受阻:", err));
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
        } else if (el.mozRequestFullScreen) {
          el.mozRequestFullScreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        }
      }
    }

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullScreen();
    });

    function handleFullscreenChange() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (isFs) {
        fsIcon.className = 'fa-solid fa-compress';
        if (fsText) fsText.textContent = '退出全螢幕';
        fullscreenBtn.title = '退出全螢幕 (快捷鍵: Esc / F)';
      } else {
        fsIcon.className = 'fa-solid fa-expand';
        if (fsText) fsText.textContent = '全螢幕播放';
        fullscreenBtn.title = '切換全螢幕 (快捷鍵: F)';
        showControls();
      }
    }

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, handleFullscreenChange);
    });

    // 全螢幕時自動隱藏操作工具列（3 秒無動作淡出，滑鼠移動立即浮現）
    function showControls() {
      controlUIs.forEach(el => el.classList.remove('hide-controls'));
      container.style.cursor = 'default';
      clearTimeout(hideControlsTimeout);
      if (document.fullscreenElement && isPlaying) {
        hideControlsTimeout = setTimeout(() => {
          controlUIs.forEach(el => el.classList.add('hide-controls'));
          container.style.cursor = 'none';
        }, 3000);
      }
    }

    container.addEventListener('mousemove', showControls);
    container.addEventListener('touchstart', showControls);

    // 本地照片上傳預覽
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (files.length > 0) {
        const newPhotos = files.map(file => ({
          url: URL.createObjectURL(file),
          title: file.name
        }));
        photos = [...photos, ...newPhotos];
        currentIndex = photos.length - newPhotos.length;
        updateDisplay(true);
        resetAutoplay();
      }
    });

    // 鍵盤快捷鍵：空白鍵暫停/播放、左右方向鍵換張、F 鍵全螢幕
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        playBtn.click();
      } else if (e.code === 'ArrowLeft') {
        goToIndex(currentIndex - 1);
      } else if (e.code === 'ArrowRight') {
        goToIndex(currentIndex + 1);
      } else if (e.code === 'KeyF') {
        toggleFullScreen();
      }
    });

    // 啟動
    init();
  </script>
</body>
</html>
