<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡本機影音剪輯器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    input[type=range] {
      accent-color: #6366f1;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- 頂部標題列 -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur px-6 py-3.5 flex items-center justify-between sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-base">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <div>
        <h1 class="font-bold text-base text-white tracking-wide flex items-center gap-2">
          <span>極簡影音剪接器</span>
          <span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded-full font-medium">本機安全處理</span>
        </h1>
        <p class="text-xs text-slate-400">一鍵精準剪輯區間、快速匯出短片、轉 GIF 動圖與畫面截圖</p>
      </div>
    </div>
    
    <label for="videoInput" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-lg text-xs font-semibold cursor-pointer transition flex items-center gap-1.5 shadow-md shadow-indigo-600/20">
      <i class="fa-solid fa-folder-open"></i>
      <span>選取影片</span>
    </label>
    <input type="file" id="videoInput" accept="video/*" class="hidden">
  </header>

  <!-- 主內容容器 -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 space-y-5">
    
    <!-- 播放器舞台與拖曳區 -->
    <div id="playerBox" class="relative bg-black rounded-2xl overflow-hidden shadow-xl border border-slate-800 aspect-video flex items-center justify-center group">
      
      <!-- 初始未選取狀態 -->
      <div id="emptyView" class="text-center p-6 transition-all">
        <div class="w-14 h-14 rounded-2xl bg-slate-800/80 text-indigo-400 mx-auto flex items-center justify-center text-2xl mb-3 border border-slate-700/60 shadow-inner">
          <i class="fa-solid fa-film"></i>
        </div>
        <h2 class="text-base font-semibold text-slate-200 mb-1">尚未載入影片</h2>
        <p class="text-xs text-slate-400 max-w-xs mx-auto mb-4">支援 MP4, WebM 或 MOV，可直接點擊下方按鈕或將檔案拖曳至此處。</p>
        <button onclick="document.getElementById('videoInput').click()" class="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-indigo-600/20">
          <i class="fa-solid fa-cloud-arrow-up"></i> 瀏覽電腦中的影片
        </button>
      </div>

      <!-- 原生影片播放元素 -->
      <video id="videoPlayer" class="w-full h-full object-contain hidden" playsinline></video>

      <!-- 拖曳提示浮層 -->
      <div id="dragPrompt" class="absolute inset-0 bg-indigo-950/90 border-2 border-dashed border-indigo-400 rounded-2xl flex flex-col items-center justify-center gap-2 pointer-events-none opacity-0 transition-opacity">
        <i class="fa-solid fa-arrow-down text-3xl text-indigo-300 animate-bounce"></i>
        <p class="text-xs font-semibold text-indigo-100">放開以載入影片</p>
      </div>

      <!-- 匯出中等待遮罩 -->
      <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-sm flex flex-col items-center justify-center gap-3 hidden z-30">
        <div class="w-9 h-9 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <div class="text-center">
          <p id="loadingTitle" class="text-sm font-semibold text-white">正在處理中...</p>
          <p id="loadingProgress" class="text-xs text-indigo-300 mt-1 font-mono">0%</p>
        </div>
      </div>
    </div>

    <!-- 簡易播放控制列 -->
    <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 text-xs">
      <div class="flex items-center gap-2">
        <button id="playPauseBtn" class="w-8 h-8 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition">
          <i class="fa-solid fa-play text-xs"></i>
        </button>
        <span id="timeText" class="font-mono text-slate-300 text-xs">00:00 / 00:00</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- 播放速度 -->
        <div class="flex items-center gap-1 bg-slate-900/80 px-2 py-1 rounded-lg border border-slate-700/60">
          <span class="text-slate-400 text-[11px]">倍速:</span>
          <select id="playbackRate" class="bg-transparent text-indigo-300 font-medium focus:outline-none cursor-pointer">
            <option value="0.5">0.5x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.5">1.5x</option>
            <option value="2.0">2.0x</option>
          </select>
        </div>

        <!-- 截圖並下載 -->
        <button id="snapBtn" class="px-2.5 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 hover:bg-amber-500 hover:text-slate-950 border border-amber-500/30 transition flex items-center gap-1 font-medium" title="擷取當前播放畫面為相片">
          <i class="fa-solid fa-camera"></i>
          <span>截圖</span>
        </button>
      </div>
    </div>

    <!-- 核心剪輯工作台 (大幅簡化直覺化) -->
    <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 md:p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-timeline text-indigo-400"></i>
          <span>片段區間剪輯</span>
        </h2>
        <span id="rangeDurationText" class="text-xs text-indigo-300 font-mono font-medium">區間長度：0.0 秒</span>
      </div>

      <!-- 區間滑動拉桿與時間定位 -->
      <div class="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80">
        <!-- 主播放進度拉桿 -->
        <div>
          <div class="flex justify-between text-[11px] text-slate-400 mb-1">
            <span>當前位置</span>
            <span id="seekTimeText" class="font-mono text-indigo-300">00:00</span>
          </div>
          <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
        </div>

        <!-- 起訖點快速標定按鈕 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          
          <!-- 起點設定 -->
          <div class="flex items-center justify-between bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
            <div>
              <span class="text-[10px] text-slate-400 block">剪輯起點 (A)</span>
              <span id="startTimeText" class="font-mono text-xs font-semibold text-emerald-400">00:00.0</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="setStartBtn" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-medium rounded transition">
                設為起點
              </button>
              <button id="jumpStartBtn" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded transition" title="跳轉至起點">
                <i class="fa-solid fa-backward-step"></i>
              </button>
            </div>
          </div>

          <!-- 終點設定 -->
          <div class="flex items-center justify-between bg-slate-900/90 p-2.5 rounded-lg border border-slate-800">
            <div>
              <span class="text-[10px] text-slate-400 block">剪輯終點 (B)</span>
              <span id="endTimeText" class="font-mono text-xs font-semibold text-rose-400">00:00.0</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="setEndBtn" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white text-[11px] font-medium rounded transition">
                設為終點
              </button>
              <button id="jumpEndBtn" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded transition" title="跳轉至終點">
                <i class="fa-solid fa-forward-step"></i>
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- 匯出與預覽操作按鈕列 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
        <div class="flex items-center gap-2">
          <!-- 區間循環試播 -->
          <button id="previewClipBtn" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition flex items-center gap-1.5 border border-slate-700">
            <i class="fa-solid fa-repeat text-indigo-400"></i>
            <span>試播片段</span>
          </button>
          <button id="resetRangeBtn" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg text-xs transition">
            重設全片
          </button>
        </div>

        <div class="flex items-center gap-2">
          <!-- 一鍵轉成 GIF -->
          <button id="exportGifBtn" class="px-3.5 py-2 bg-pink-600 hover:bg-pink-500 active:scale-95 text-white rounded-lg text-xs font-semibold shadow-md shadow-pink-600/20 transition flex items-center gap-1.5">
            <i class="fa-solid fa-image"></i>
            <span>轉成 GIF</span>
          </button>
          
          <!-- 匯出剪輯影片 -->
          <button id="exportVideoBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-lg text-xs font-semibold shadow-md shadow-indigo-600/30 transition flex items-center gap-1.5">
            <i class="fa-solid fa-download"></i>
            <span>匯出剪輯影片</span>
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    // 元素參照
    const video = document.getElementById('videoPlayer');
    const emptyView = document.getElementById('emptyView');
    const playerBox = document.getElementById('playerBox');
    const dragPrompt = document.getElementById('dragPrompt');
    const videoInput = document.getElementById('videoInput');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const timeText = document.getElementById('timeText');
    const seekSlider = document.getElementById('seekSlider');
    const seekTimeText = document.getElementById('seekTimeText');
    const playbackRate = document.getElementById('playbackRate');
    const snapBtn = document.getElementById('snapBtn');

    const rangeDurationText = document.getElementById('rangeDurationText');
    const startTimeText = document.getElementById('startTimeText');
    const endTimeText = document.getElementById('endTimeText');
    const setStartBtn = document.getElementById('setStartBtn');
    const setEndBtn = document.getElementById('setEndBtn');
    const jumpStartBtn = document.getElementById('jumpStartBtn');
    const jumpEndBtn = document.getElementById('jumpEndBtn');
    const previewClipBtn = document.getElementById('previewClipBtn');
    const resetRangeBtn = document.getElementById('resetRangeBtn');
    const exportGifBtn = document.getElementById('exportGifBtn');
    const exportVideoBtn = document.getElementById('exportVideoBtn');

    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingTitle = document.getElementById('loadingTitle');
    const loadingProgress = document.getElementById('loadingProgress');

    // 狀態變數
    let currentFile = null;
    let videoUrl = null;
    let clipStart = 0;
    let clipEnd = 0;
    let isPreviewing = false;

    // 時間格式化 (秒 -> MM:SS.s)
    function fmt(sec, showTenths = false) {
      if (isNaN(sec) || sec === Infinity) return '00:00';
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      if (showTenths) {
        const t = Math.floor((sec % 1) * 10);
        return `${m}:${s}.${t}`;
      }
      return `${m}:${s}`;
    }

    // 載入影片
    function loadVideo(file) {
      if (!file || !file.type.startsWith('video/')) {
        alert('請選取正確的影片格式檔案');
        return;
      }
      currentFile = file;
      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(file);

      video.src = videoUrl;
      emptyView.classList.add('hidden');
      video.classList.remove('hidden');
      video.load();
    }

    video.addEventListener('loadedmetadata', () => {
      const dur = video.duration || 0;
      clipStart = 0;
      clipEnd = dur;
      seekSlider.max = dur;
      seekSlider.value = 0;
      updateRangeUI();
      video.play().catch(() => {});
    });

    video.addEventListener('timeupdate', () => {
      const cur = video.currentTime;
      const dur = video.duration || 1;
      timeText.textContent = `${fmt(cur)} / ${fmt(dur)}`;
      seekTimeText.textContent = fmt(cur, true);
      seekSlider.value = cur;

      // 區間試播循環
      if (isPreviewing) {
        if (cur >= clipEnd || cur < clipStart) {
          video.currentTime = clipStart;
        }
      }
    });

    video.addEventListener('play', () => {
      playPauseBtn.innerHTML = '<i class="fa-solid fa-pause text-xs"></i>';
    });
    video.addEventListener('pause', () => {
      playPauseBtn.innerHTML = '<i class="fa-solid fa-play text-xs"></i>';
    });

    playPauseBtn.addEventListener('click', () => {
      if (!video.duration) return;
      if (video.paused) video.play(); else video.pause();
    });

    seekSlider.addEventListener('input', () => {
      if (!video.duration) return;
      video.currentTime = parseFloat(seekSlider.value);
    });

    playbackRate.addEventListener('change', () => {
      video.playbackRate = parseFloat(playbackRate.value) || 1.0;
    });

    // 區間起訖點管理
    function updateRangeUI() {
      startTimeText.textContent = fmt(clipStart, true);
      endTimeText.textContent = fmt(clipEnd, true);
      const diff = Math.max(0, clipEnd - clipStart);
      rangeDurationText.textContent = `區間長度：${diff.toFixed(1)} 秒`;
    }

    setStartBtn.addEventListener('click', () => {
      if (!video.duration) return;
      if (video.currentTime >= clipEnd) {
        alert('起點不能大於或等於終點');
        return;
      }
      clipStart = video.currentTime;
      updateRangeUI();
    });

    setEndBtn.addEventListener('click', () => {
      if (!video.duration) return;
      if (video.currentTime <= clipStart) {
        alert('終點不能小於或等於起點');
        return;
      }
      clipEnd = video.currentTime;
      updateRangeUI();
    });

    jumpStartBtn.addEventListener('click', () => {
      if (video.duration) video.currentTime = clipStart;
    });
    jumpEndBtn.addEventListener('click', () => {
      if (video.duration) video.currentTime = clipEnd;
    });

    resetRangeBtn.addEventListener('click', () => {
      if (!video.duration) return;
      clipStart = 0;
      clipEnd = video.duration;
      isPreviewing = false;
      previewClipBtn.classList.remove('bg-indigo-600', 'text-white');
      updateRangeUI();
    });

    // 試播
    previewClipBtn.addEventListener('click', () => {
      if (!video.duration) return;
      isPreviewing = !isPreviewing;
      if (isPreviewing) {
        video.currentTime = clipStart;
        video.play();
        previewClipBtn.classList.add('bg-indigo-600', 'text-white');
      } else {
        previewClipBtn.classList.remove('bg-indigo-600', 'text-white');
      }
    });

    // 畫面截圖
    snapBtn.addEventListener('click', () => {
      if (!video.videoWidth) {
        alert('請先載入並播放影片！');
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `snapshot_${Date.now()}.png`;
      a.click();
    });

    // 轉成 GIF 動圖
    exportGifBtn.addEventListener('click', async () => {
      if (!video.duration) {
        alert('請先載入影片！');
        return;
      }
      const dur = clipEnd - clipStart;
      if (dur < 0.2) {
        alert('剪輯長度至少需 0.2 秒');
        return;
      }
      if (dur > 6) {
        if (!confirm(`目前選取長度為 ${dur.toFixed(1)} 秒。GIF 超過 5 秒檔案較大且較慢，建議縮短區間，是否繼續？`)) return;
      }

      loadingOverlay.classList.remove('hidden');
      loadingTitle.textContent = '正在擷取畫面轉成 GIF...';
      loadingProgress.textContent = '0%';
      video.pause();

      const fps = 8;
      const totalFrames = Math.min(30, Math.max(5, Math.round(dur * fps)));
      const step = dur / totalFrames;
      const frames = [];

      const canvas = document.createElement('canvas');
      const targetW = 320;
      const targetH = Math.round(targetW * ((video.videoHeight || 360) / (video.videoWidth || 640)));
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      for (let i = 0; i < totalFrames; i++) {
        video.currentTime = clipStart + (i * step);
        await new Promise(r => {
          const onSeek = () => { video.removeEventListener('seeked', onSeek); r(); };
          video.addEventListener('seeked', onSeek);
          setTimeout(r, 150);
        });
        ctx.drawImage(video, 0, 0, targetW, targetH);
        frames.push(canvas.toDataURL('image/jpeg', 0.7));
        loadingProgress.textContent = `${Math.round(((i + 1) / totalFrames) * 60)}%`;
      }

      loadingTitle.textContent = '正在合成 GIF 動圖...';
      gifshot.createGIF({
        images: frames,
        gifWidth: targetW,
        gifHeight: targetH,
        interval: 1 / fps,
        sampleInterval: 20
      }, (obj) => {
        loadingOverlay.classList.add('hidden');
        if (!obj.error && obj.image) {
          const a = document.createElement('a');
          a.href = obj.image;
          a.download = `clip_${Date.now()}.gif`;
          a.click();
        } else {
          alert('GIF 產出失敗，請縮短剪輯區間後再試');
        }
      });
    });

    // 匯出剪輯影片 (純本機 MediaRecorder 錄製)
    exportVideoBtn.addEventListener('click', async () => {
      if (!video.duration) {
        alert('請先載入影片！');
        return;
      }
      const dur = clipEnd - clipStart;
      if (dur < 0.3) {
        alert('剪輯長度至少需大於 0.3 秒');
        return;
      }

      if (!window.MediaRecorder) {
        alert('您的瀏覽器不支援本機錄製功能');
        return;
      }

      loadingOverlay.classList.remove('hidden');
      loadingTitle.textContent = '正在剪輯並匯出影片...';
      loadingProgress.textContent = '準備中...';

      video.pause();
      video.currentTime = clipStart;

      await new Promise(r => {
        const onSeek = () => { video.removeEventListener('seeked', onSeek); r(); };
        video.addEventListener('seeked', onSeek);
        setTimeout(r, 300);
      });

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');

      let stream = null;
      if (typeof video.captureStream === 'function') {
        try { stream = video.captureStream(); } catch (e) {}
      }
      if (!stream) {
        stream = canvas.captureStream(30);
      }

      const mimeType = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm';
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];

      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const donePromise = new Promise(resolve => {
        recorder.onstop = resolve;
      });

      recorder.start(100);
      video.muted = true;
      video.play().catch(() => {});

      let animId;
      const checkLoop = () => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const cur = video.currentTime;
        const elapsed = cur - clipStart;
        const pct = Math.min(100, Math.max(0, Math.round((elapsed / dur) * 100)));
        loadingProgress.textContent = `${pct}%`;

        if (cur >= clipEnd || video.ended) {
          cancelAnimationFrame(animId);
          video.pause();
          recorder.stop();
        } else {
          animId = requestAnimationFrame(checkLoop);
        }
      };
      animId = requestAnimationFrame(checkLoop);

      await donePromise;
      loadingOverlay.classList.add('hidden');

      if (chunks.length > 0) {
        const blob = new Blob(chunks, { type: mimeType });
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `trimmed_video_${Date.now()}.${ext}`;
        a.click();
      } else {
        alert('匯出失敗，請重試');
      }
    });

    // 檔案拖曳與選取事件
    videoInput.addEventListener('change', e => {
      if (e.target.files && e.target.files[0]) {
        loadVideo(e.target.files[0]);
      }
    });

    playerBox.addEventListener('dragover', e => {
      e.preventDefault();
      dragPrompt.classList.remove('opacity-0');
    });
    playerBox.addEventListener('dragleave', e => {
      e.preventDefault();
      dragPrompt.classList.add('opacity-0');
    });
    playerBox.addEventListener('drop', e => {
      e.preventDefault();
      dragPrompt.classList.add('opacity-0');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        loadVideo(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
